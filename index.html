<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoT Smart Air Pollution Awareness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://github.com/Gmstree/Images/blob/main/airfav-01.png?raw=true" type="image/png">
    
    <!-- Preload Logos for Instant Rendering -->
    <link rel="preload" as="image" href="https://github.com/Gmstree/Images/blob/main/airw.png?raw=true">
    <link rel="preload" as="image" href="https://github.com/Gmstree/Images/blob/main/airb.png?raw=true">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              paper: '#fdfbf7',
              darkPaper: '#0f172a',
              uni: {
                900: '#1a202c',
                800: '#2d3748',
                accent: '#c0392b',
                darkAccent: '#e74c3c'
              }
            },
            animation: {
              'drift-slow': 'drift 35s infinite linear',
              'drift-medium': 'drift 25s infinite linear',
              'drift-fast': 'drift 15s infinite linear',
              'pulse-slow': 'pulseGlow 6s infinite ease-in-out',
              'twinkle': 'twinkle 4s infinite ease-in-out',
              'float': 'float 6s infinite ease-in-out',
              'spin-slow': 'spin 12s linear infinite',
              'wind-flow': 'windFlow 2s linear infinite',
              'wind-rush': 'windRush 0.8s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Realistic Drifting Clouds/Air - More distinct movement */
      @keyframes drift {
        0% { transform: translateX(-50%) translateY(10px) scale(1); opacity: 0; }
        10% { opacity: 0.9; } /* Increased opacity for visibility */
        50% { opacity: 0.8; transform: translateX(50vw) translateY(-10px) scale(1.1); }
        90% { opacity: 0.9; }
        100% { transform: translateX(120vw) translateY(10px) scale(1); opacity: 0; }
      }

      /* Subtle breathing for sun */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; transform: scale(1); box-shadow: 0 0 60px 25px rgba(253, 224, 71, 0.5); }
        50% { opacity: 1; transform: scale(1.05); box-shadow: 0 0 90px 40px rgba(253, 224, 71, 0.7); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      /* Preloader Wind Animation */
      @keyframes windFlow {
        0% { transform: translateX(-100%); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
      }
      
      /* Faster Wind Rush for Preloader */
      @keyframes windRush {
        0% { transform: translateX(-100%) scaleX(0.5); opacity: 0; }
        50% { opacity: 0.8; transform: translateX(0%) scaleX(1.2); }
        100% { transform: translateX(200%) scaleX(0.5); opacity: 0; }
      }

      .stars-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      
      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle var(--duration) infinite ease-in-out;
        opacity: 0.9;
        box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.6);
      }

      /* Glassmorphism utility */
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-gray-100">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
